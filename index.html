<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan WAT - WEL26EQ2S1</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: 50px;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
        }

        header p {
            margin: 4px 0 0 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .container {
            max-width: 650px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* Nowoczesny pasek dni */
        .days-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        .days-container::-webkit-scrollbar {
            display: none;
        }

        .day-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .day-btn.active {
            background-color: var(--accent);
            color: var(--bg-color);
            border-color: var(--accent);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        /* Kafelki zajęć w stylu planwat.pl */
        .lesson-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.1s ease, border-color 0.2s ease;
        }

        .lesson-card:hover {
            border-color: var(--accent);
        }

        .lesson-card:active {
            transform: scale(0.99);
        }

        .lesson-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lesson-time {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent);
            background: var(--accent-glow);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .room-tag {
            background-color: #334155;
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .lesson-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
        }

        .lesson-footer {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--border);
            padding-top: 8px;
            margin-top: 2px;
        }

        /* Sekcja mapy */
        .map-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-top: 25px;
            text-align: center;
        }

        .map-section h3 {
            margin: 0 0 12px 0;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .map-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .map-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        .map-pin {
            position: absolute;
            background-color: #ef4444;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.9);
            animation: pulse 1.5s infinite;
            display: none;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.85; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>WEL26EQ2S1</h1>
        <p>Semestr Zimowy • WAT</p>
    </header>

    <div class="container">
        <!-- Pasek dni -->
        <div class="days-container">
            <button class="day-btn active" onclick="switchDay('poniedzialek')">Poniedziałek</button>
            <button class="day-btn" onclick="switchDay('wtorek')">Wtorek</button>
            <button class="day-btn" onclick="switchDay('sroda')">Środa</button>
            <button class="day-btn" onclick="switchDay('czwartek')">Czwartek</button>
            <button class="day-btn" onclick="switchDay('piatek')">Piątek</button>
        </div>

        <!-- Lista zajęć -->
        <div id="lessonsList"></div>

        <!-- Mapa -->
        <div class="map-section">
            <h3 id="mapTitle">Wskaźnik budynku na mapie</h3>
            <div class="map-wrapper">
                <img src="image_8f24b6.png" alt="Mapa WAT" id="kampusMap">
                <div id="mapPin" class="map-pin">Budynek</div>
            </div>
        </div>
    </div>

    <script>
        const scheduleData = {
            poniedzialek: [
                { time: "08:00 - 09:35", title: "Fizyka (Wykład)", type: "Wykład", lecturer: "dr hab. inż.", room: "Bud. 45 (WEL)", coords: { top: "67%", left: "72%" } },
                { time: "09:50 - 11:25", title: "Matematyka 2", type: "Ćwiczenia", lecturer: "dr inż.", room: "Bud. 100 (WCY)", coords: { top: "52%", left: "48%" } },
                { time: "11:45 - 13:15", title: "Mechanika techniczna", type: "Wykład", lecturer: "dr hab.", room: "Bud. 136 (IOE)", coords: { top: "78%", left: "73%" } }
            ],
            wtorek: [
                { time: "08:00 - 11:15", title: "Elektronika i Metrologia", type: "Laboratorium", lecturer: "dr inż.", room: "Bud. 45 (WEL)", coords: { top: "67%", left: "72%" } },
                { time: "11:30 - 13:00", title: "Technologia materiałów", type: "Wykład", lecturer: "prof. WAT", room: "Bud. 58 (WIG)", coords: { top: "44%", left: "68%" } }
            ],
            sroda: [
                { time: "09:00 - 12:15", title: "Podstawy grafiki inżynierskiej", type: "Projekt", lecturer: "dr inż.", room: "Bud. 63 (WML)", coords: { top: "40%", left: "62%" } },
                { time: "12:30 - 14:00", title: "Język angielski", type: "Lektorat", lecturer: "mgr", room: "Studium Języków Obcych", coords: { top: "35%", left: "20%" } }
            ],
            czwartek: [
                { time: "10:00 - 13:15", title: "Informatyka w Inżynierii", type: "Laboratorium", lecturer: "dr inż.", room: "Bud. 100 (WCY)", coords: { top: "52%", left: "48%" } },
                { time: "13:30 - 15:00", title: "Przedmiot humanistyczny", type: "Wykład", lecturer: "dr", room: "Bud. 58 (WIG)", coords: { top: "44%", left: "68%" } }
            ],
            piatek: [
                { time: "08:00 - 11:00", title: "Wychowanie fizyczne", type: "WF", lecturer: "Studium W-F", room: "Ośrodek Sportowy WAT", coords: { top: "75%", left: "15%" } }
            ]
        };

        function switchDay(day) {
            document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const listContainer = document.getElementById('lessonsList');
            listContainer.innerHTML = '';

            const dayLessons = scheduleData[day] || [];
            
            if (dayLessons.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; color:#94a3b8; padding: 20px;">Brak zajęć w tym dniu 🎉</p>';
                hidePin();
                return;
            }

            dayLessons.forEach((lesson) => {
                const card = document.createElement('div');
                card.className = 'lesson-card';
                card.innerHTML = `
                    <div class="lesson-header">
                        <span class="lesson-time">${lesson.time}</span>
                        <span class="room-tag">${lesson.room}</span>
                    </div>
                    <div class="lesson-title">${lesson.title}</div>
                    <div class="lesson-footer">
                        <span>Prowadzący: ${lesson.lecturer}</span>
                        <span>${lesson.type}</span>
                    </div>
                `;
                card.onclick = () => showBuildingOnMap(lesson.room, lesson.coords);
                listContainer.appendChild(card);
            });

            if (dayLessons.length > 0) {
                showBuildingOnMap(dayLessons[0].room, dayLessons[0].coords);
            }
        }

        function showBuildingOnMap(roomName, coords) {
            const pin = document.getElementById('mapPin');
            const mapTitle = document.getElementById('mapTitle');
            
            mapTitle.innerText = `Lokalizacja: ${roomName}`;
            pin.style.top = coords.top;
            pin.style.left = coords.left;
            pin.innerText = roomName;
            pin.style.display = 'block';
        }

        function hidePin() {
            document.getElementById('mapPin').style.display = 'none';
            document.getElementById('mapTitle').innerText = 'Lokalizacja budynku na mapie';
        }

        window.onload = () => {
            switchDay('poniedzialek');
        };
    </script>
</body>
</html>
